<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131b30"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#7fb0ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7fb0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#a688fb" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a688fb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2f7ff"/>
      <stop offset="60%" stop-color="#cfe0ff"/>
      <stop offset="100%" stop-color="#9fc4ff"/>
    </linearGradient>
    <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3dfc9e"/>
      <stop offset="25%" stop-color="#ffc247"/>
      <stop offset="50%" stop-color="#ff9640"/>
      <stop offset="70%" stop-color="#ff5c85"/>
      <stop offset="85%" stop-color="#ef4fc0"/>
      <stop offset="100%" stop-color="#c93a5a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow1)"/>
  <rect width="1200" height="320" fill="url(#glow2)"/>

  <!-- scattered ambient dots, matching the app's haze/starfield motif -->
  <g fill="#a9b4d0" opacity="0.35">
    <circle cx="70" cy="46" r="1.6"/><circle cx="180" cy="90" r="1.2"/><circle cx="260" cy="40" r="1.4"/>
    <circle cx="940" cy="55" r="1.5"/><circle cx="1020" cy="110" r="1.2"/><circle cx="1120" cy="60" r="1.6"/>
    <circle cx="1150" cy="230" r="1.3"/><circle cx="1080" cy="270" r="1.5"/><circle cx="60" cy="260" r="1.4"/>
    <circle cx="140" cy="230" r="1.2"/><circle cx="990" cy="200" r="1.3"/><circle cx="330" cy="270" r="1.2"/>
  </g>

  <!-- AQI ring motif, right side -->
  <g transform="translate(1015,160)">
    <circle r="86" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="12"/>
    <circle r="86" fill="none" stroke="#ffc247" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="356 540" transform="rotate(-90)"/>
    <text x="0" y="-2" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',sans-serif"
      font-size="46" font-weight="700" fill="#f3f6fd">87</text>
    <text x="0" y="26" text-anchor="middle" font-family="'Segoe UI',sans-serif"
      font-size="13" fill="#a9b4d0" letter-spacing="1">AQI · MODERATE</text>
  </g>

  <!-- Wordmark + tagline -->
  <text x="70" y="150" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="72" font-weight="700"
    fill="url(#titleGrad)" letter-spacing="-1.5">VayuSense</text>
  <text x="72" y="192" font-family="'Segoe UI',sans-serif" font-size="22" fill="#a9b4d0">
    Know when the air is safe.
  </text>
  <text x="72" y="224" font-family="'Segoe UI',sans-serif" font-size="15" fill="#7c88a8">
    AI decision intelligence for India's air, built on Google ADK + Gemini and NVIDIA RAPIDS.
  </text>

  <!-- severity ramp signature bar -->
  <rect x="70" y="260" width="640" height="6" rx="3" fill="url(#ramp)"/>
  <text x="70" y="290" font-family="'Segoe UI',sans-serif" font-size="12.5" fill="#7c88a8" letter-spacing="0.5">
    GOOD · MODERATE · POOR · UNHEALTHY · SEVERE · HAZARDOUS
  </text>
</svg>
