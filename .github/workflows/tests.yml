name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned dependencies
        # requirements.txt is what ships in the image; the ML file adds
        # scikit-learn (the bench) and pytest, which the image does not need.
        run: pip install -r requirements.txt -r ml/requirements-ml.txt
      - name: Run the test suite
        # No Gemini or OpenAQ key is set here on purpose: the tests fake the
        # model and the live feed, so a green run proves nothing depends on a
        # secret or the network.
        run: python -m pytest -q
